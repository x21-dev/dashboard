<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #0f1115;
    --bg-grad-1: #12151c;
    --bg-grad-2: #0b0d11;
    --fg: #f2f3f5;
    --fg-dim: #9aa1ac;
    --accent: #7dc4ff;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --divider: rgba(255,255,255,0.08);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f6f9;
      --bg-grad-1: #ffffff;
      --bg-grad-2: #e9edf3;
      --fg: #1b1e24;
      --fg-dim: #62697a;
      --accent: #1f6fb2;
      --card-bg: rgba(0,0,0,0.03);
      --card-border: rgba(0,0,0,0.07);
      --divider: rgba(0,0,0,0.08);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --bg-grad-1: #12151c;
    --bg-grad-2: #0b0d11;
    --fg: #f2f3f5;
    --fg-dim: #9aa1ac;
    --accent: #7dc4ff;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --divider: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 30% 10%, var(--bg-grad-1), var(--bg-grad-2) 70%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: clamp(16px, 4vw, 32px);
    padding-top: calc(clamp(16px, 4vw, 32px) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(clamp(16px, 4vw, 32px) + env(safe-area-inset-bottom, 0px));
    gap: clamp(14px, 3vh, 28px);
    min-height: 0;
  }

  /* CLOCK */
  .clock-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex: 0 0 50%;
    min-height: 0;
    overflow: hidden;
  }

  .time {
    font-size: clamp(40px, min(30vh, 22vw), 340px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .date {
    margin-top: 8px;
    font-size: clamp(14px, 4vh, 32px);
    color: var(--fg-dim);
    font-weight: 500;
  }

  .divider {
    height: 1px;
    width: 100%;
    background: var(--divider);
    flex: 0 0 auto;
  }

  /* WEATHER */
  .weather-section {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2vh, 18px);
    overflow: hidden;
  }

  #weatherContent {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2vh, 18px);
    width: fit-content;
    max-width: 100%;
  }

  .weather-now {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 20px);
  }

  .weather-icon {
    font-size: clamp(40px, 10vw, 64px);
    line-height: 1;
  }

  .weather-temp {
    font-size: clamp(36px, 9vw, 60px);
    font-weight: 700;
    line-height: 1;
  }

  .weather-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .weather-desc {
    font-size: clamp(14px, 3vw, 18px);
    color: var(--fg);
    font-weight: 600;
  }

  .weather-sub {
    font-size: clamp(12px, 2.4vw, 15px);
    color: var(--fg-dim);
  }

  .location {
    font-size: clamp(12px, 2.4vw, 14px);
    color: var(--fg-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .location button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: inherit;
    cursor: pointer;
    padding: 2px 4px;
    text-decoration: underline;
  }

  .stats-row {
    display: flex;
    gap: clamp(8px, 2vw, 12px);
    width: 100%;
  }

  .stat-card {
    flex: 1 1 0;
    min-width: 0;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: clamp(10px, 2vw, 14px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
  }

  .stat-label {
    font-size: clamp(10px, 2vw, 12px);
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stat-value {
    font-size: clamp(16px, 3.6vw, 22px);
    font-weight: 600;
  }

  .forecast-row {
    display: flex;
    justify-content: center;
    gap: clamp(6px, 1.6vw, 10px);
    max-width: 100%;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }

  .forecast-day {
    flex: 0 0 auto;
    min-width: 64px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 10px 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .forecast-day .d { font-size: 11px; color: var(--fg-dim); font-weight: 600; text-transform: uppercase; }
  .forecast-day .i { font-size: 22px; }
  .forecast-day .hi { font-size: 13px; font-weight: 700; }
  .forecast-day .lo { font-size: 12px; color: var(--fg-dim); }

  .status-line {
    font-size: 12px;
    color: var(--fg-dim);
    text-align: center;
    min-height: 16px;
  }

  .setup {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    text-align: center;
  }

  .setup input {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--fg);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    width: 100%;
    max-width: 260px;
  }

  .setup button {
    background: var(--accent);
    color: #0b0d11;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .setup-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 320px;
  }

  .hint {
    font-size: 12px;
    color: var(--fg-dim);
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="clock-section">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">Loading…</div>
  </div>

  <div class="divider"></div>

  <div class="weather-section" id="weatherSection">
    <div id="weatherContent">
      <div class="hint">Loading weather…</div>
    </div>
  </div>

</div>

<script>
(function() {
  // ---------- CLOCK ----------
  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    document.getElementById('time').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.getElementById('date').textContent = now.toLocaleDateString(undefined, {
      weekday: 'long', day: 'numeric', month: 'long'
    });
  }
  updateClock();
  setInterval(updateClock, 1000 * 10);
  setInterval(() => { document.getElementById('time').textContent = pad(new Date().getHours()) + ':' + pad(new Date().getMinutes()); }, 1000);

  // ---------- WEATHER CODE MAP (Open-Meteo WMO codes) ----------
  const WMO = {
    0: ['Clear sky', '☀️'],
    1: ['Mainly clear', '🌤️'],
    2: ['Partly cloudy', '⛅'],
    3: ['Overcast', '☁️'],
    45: ['Fog', '🌫️'],
    48: ['Depositing rime fog', '🌫️'],
    51: ['Light drizzle', '🌦️'],
    53: ['Drizzle', '🌦️'],
    55: ['Dense drizzle', '🌧️'],
    56: ['Freezing drizzle', '🌧️'],
    57: ['Freezing drizzle', '🌧️'],
    61: ['Slight rain', '🌦️'],
    63: ['Rain', '🌧️'],
    65: ['Heavy rain', '🌧️'],
    66: ['Freezing rain', '🌧️'],
    67: ['Freezing rain', '🌧️'],
    71: ['Slight snow', '🌨️'],
    73: ['Snow', '🌨️'],
    75: ['Heavy snow', '❄️'],
    77: ['Snow grains', '❄️'],
    80: ['Slight showers', '🌦️'],
    81: ['Showers', '🌧️'],
    82: ['Violent showers', '⛈️'],
    85: ['Slight snow showers', '🌨️'],
    86: ['Heavy snow showers', '❄️'],
    95: ['Thunderstorm', '⛈️'],
    96: ['Thunderstorm + hail', '⛈️'],
    99: ['Thunderstorm + hail', '⛈️'],
  };

  function describeCode(code) {
    return WMO[code] || ['Unknown', '❓'];
  }

  // ---------- LOCATION STORAGE ----------
  function getSavedLocation() {
    try {
      const raw = localStorage.getItem('dash_location');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveLocation(loc) {
    try { localStorage.setItem('dash_location', JSON.stringify(loc)); } catch (e) {}
  }

  const weatherContent = document.getElementById('weatherContent');

  function renderSetup(message) {
    weatherContent.innerHTML = `
      <div class="setup">
        <div class="hint">${message || 'Set a location to show weather.'}</div>
        <div class="setup-row">
          <input type="text" id="cityInput" placeholder="e.g. London, UK" />
          <button id="cityGo">Set</button>
        </div>
        <button id="useGeo" style="background:none;border:1px solid var(--card-border);color:var(--fg-dim);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;">Use device location instead</button>
      </div>
    `;
    document.getElementById('cityGo').addEventListener('click', async () => {
      const val = document.getElementById('cityInput').value.trim();
      if (!val) return;
      weatherContent.innerHTML = '<div class="hint">Looking up location…</div>';
      try {
        const geoRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(val) + '&count=1&language=en&format=json');
        const geoData = await geoRes.json();
        if (!geoData.results || !geoData.results.length) {
          renderSetup('Couldn\'t find that place — try a different spelling.');
          return;
        }
        const r = geoData.results[0];
        const loc = {
          lat: r.latitude,
          lon: r.longitude,
          label: [r.name, r.admin1, r.country].filter(Boolean).join(', ')
        };
        saveLocation(loc);
        loadWeather(loc);
      } catch (e) {
        renderSetup('Network error looking up that place. Try again.');
      }
    });
    document.getElementById('useGeo').addEventListener('click', () => {
      tryGeolocation();
    });
  }

  function tryGeolocation() {
    if (!navigator.geolocation) {
      renderSetup('Device location isn\'t available here — enter a city instead.');
      return;
    }
    weatherContent.innerHTML = '<div class="hint">Requesting device location…</div>';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, label: 'Current location' };
        saveLocation(loc);
        loadWeather(loc);
      },
      () => { renderSetup('Location permission denied — enter a city instead.'); },
      { timeout: 10000 }
    );
  }

  async function loadWeather(loc) {
    weatherContent.innerHTML = '<div class="hint">Loading weather…</div>';
    try {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat +
        '&longitude=' + loc.lon +
        '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
        '&wind_speed_unit=mph' +
        '&timezone=auto&forecast_days=5';
      const res = await fetch(url);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      renderWeather(loc, data);
    } catch (e) {
      weatherContent.innerHTML = `
        <div class="hint">Couldn't load weather right now. Will retry shortly.</div>
        <button id="retryBtn" style="margin-top:8px;background:none;border:1px solid var(--card-border);color:var(--fg-dim);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;">Retry now</button>
      `;
      const btn = document.getElementById('retryBtn');
      if (btn) btn.addEventListener('click', () => loadWeather(loc));
      scheduleRetry(loc);
    }
  }

  let retryTimer = null;
  function scheduleRetry(loc) {
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = setTimeout(() => loadWeather(loc), 5 * 60 * 1000);
  }

  function renderWeather(loc, data) {
    const cur = data.current;
    const [desc, icon] = describeCode(cur.weather_code);
    const days = data.daily;

    let forecastHtml = '';
    for (let i = 0; i < Math.min(5, days.time.length); i++) {
      const d = new Date(days.time[i]);
      const [dDesc, dIcon] = describeCode(days.weather_code[i]);
      forecastHtml += `
        <div class="forecast-day">
          <div class="d">${i === 0 ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' })}</div>
          <div class="i" title="${dDesc}">${dIcon}</div>
          <div class="hi">${Math.round(days.temperature_2m_max[i])}°</div>
          <div class="lo">${Math.round(days.temperature_2m_min[i])}°</div>
        </div>
      `;
    }

    weatherContent.innerHTML = `
      <div class="weather-now">
        <div class="weather-icon">${icon}</div>
        <div class="weather-temp">${Math.round(cur.temperature_2m)}°</div>
        <div class="weather-meta">
          <div class="weather-desc">${desc}</div>
          <div class="weather-sub">Feels like ${Math.round(cur.apparent_temperature)}°</div>
        </div>
      </div>
      <div class="location">
        📍 ${loc.label}
        <button id="changeLoc">change</button>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Humidity</div>
          <div class="stat-value">${cur.relative_humidity_2m}%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Wind</div>
          <div class="stat-value">${Math.round(cur.wind_speed_10m)} mph</div>
        </div>
      </div>
      <div class="forecast-row">${forecastHtml}</div>
      <div class="status-line" id="statusLine">Updated ${new Date().toLocaleTimeString(undefined, {hour: '2-digit', minute:'2-digit'})}</div>
    `;
    document.getElementById('changeLoc').addEventListener('click', () => {
      renderSetup('Set a new location.');
    });
    scheduleAutoRefresh(loc);
  }

  let refreshTimer = null;
  function scheduleAutoRefresh(loc) {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => loadWeather(loc), 15 * 60 * 1000);
  }

  // ---------- INIT ----------
  const saved = getSavedLocation();
  if (saved) {
    loadWeather(saved);
  } else {
    renderSetup();
  }
})();
</script>
</body>
</html>
